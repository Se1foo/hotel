name: Security scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, so newly-published advisories are caught without a code change.
    - cron: '0 6 * * 1'

jobs:
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-and-quality

      - uses: github/codeql-action/analyze@v3

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    strategy:
      # Report both packages even if one fails.
      fail-fast: false
      matrix:
        package: [frontend, backend]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Only high and critical advisories block; moderate findings in dev-only
      # tooling would otherwise make the check permanently red.
      - name: Audit ${{ matrix.package }}
        working-directory: ${{ matrix.package }}
        run: npm audit --audit-level=high

name: Security scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, so newly-published advisories are caught without a code change.
    - cron: '0 6 * * 1'

jobs:
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    # Code scanning needs GitHub Advanced Security on private repositories, so
    # the upload fails with "Code scanning is not enabled for this repository"
    # no matter how the workflow is configured — the analysis itself runs fine
    # and reports no findings. Skipped while private rather than left as a
    # permanently red check; it starts working the moment the repo goes public.
    if: ${{ !github.event.repository.private }}
    permissions:
      contents: read
      security-events: write
      # Required by the action to read its own workflow run. Without it the
      # analysis completes and uploads fine but the step still fails with
      # "Resource not accessible by integration" from the workflow-runs API.
      actions: read

    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-and-quality

      - uses: github/codeql-action/analyze@v3

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      # Report both packages even if one fails.
      fail-fast: false
      matrix:
        package: [frontend, backend]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Installs are needed for `npm audit` to resolve the real dependency tree.
      - name: Install ${{ matrix.package }}
        working-directory: ${{ matrix.package }}
        run: npm ci

      # Fails on any high/critical advisory that has not been explicitly
      # reviewed. See .github/scripts/audit.mjs for the allowlist and reasoning —
      # plain `npm audit --audit-level=high` cannot distinguish an unexamined
      # advisory from one knowingly accepted, which leaves you choosing between a
      # permanently red pipeline and no check at all.
      - name: Audit ${{ matrix.package }}
        run: node .github/scripts/audit.mjs ${{ matrix.package }}

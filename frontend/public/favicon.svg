<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Luxe Reserve">
  <!--
    The Luxe Reserve mark — the same two amber strokes as the header logo.

    Drawn on a solid ink tile rather than on transparency. The strokes are
    relatively thin, and at a 16px browser-tab size against an unknown tab-bar
    colour they would nearly disappear; a filled tile keeps the mark legible in
    both light and dark browser themes.
  -->
  <rect width="32" height="32" rx="7" fill="#1A1A1A"/>
  <g
    transform="translate(5.4 4.3) scale(0.733)"
    fill="none"
    stroke="#FFB800"
    stroke-width="6"
    stroke-linecap="round"
    stroke-linejoin="round"
  >
    <path d="M6 4C13 12 13 20 6 28"/>
    <path d="M16 4C23 12 23 20 16 28"/>
  </g>
</svg>
